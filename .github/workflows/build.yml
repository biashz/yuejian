name: 构建三端安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            build_args: ""
          - platform: ubuntu-22.04
            build_args: ""
          - platform: macos-latest
            build_args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    env:
      # 构建期下载的依赖全部落在工作区内，工作区外不产生额外目录
      CARGO_HOME: ${{ github.workspace }}/.toolchains/cargo
      npm_config_cache: ${{ github.workspace }}/.cache/npm

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          # 这段的全部意义是「别把 40 分钟花在 apt 上」。
          #
          # 背景：本账户的 runner 解析不了默认源（apt-get update 会一直挂起），所以
          # 之前写死换成阿里云镜像——但那台 runner 在境外，从阿里云拉 webkit 的几百个
          # 依赖实测要 36 分钟，还一度被误判成卡死。所以改成先探测、挑当下最快的可用源。
          # azure.archive 最快（同机房），但它跟官方源同属 *.ubuntu.com，未必解析得出来；
          # 解析不了就在 8 秒内放弃，不影响后面几个候选。
          candidates=(
            "http://azure.archive.ubuntu.com/ubuntu"
            "https://mirrors.edge.kernel.org/ubuntu"
            "https://mirrors.aliyun.com/ubuntu"
            "https://mirrors.tuna.tsinghua.edu.cn/ubuntu"
          )
          mirror=""
          for url in "${candidates[@]}"; do
            ok=1
            for suite in jammy jammy-updates jammy-security; do
              code=$(curl -s -o /dev/null -m 8 -w '%{http_code}' "$url/dists/$suite/Release" || true)
              if [ "$code" != "200" ]; then ok=0; break; fi
            done
            echo "探测 $url -> $([ "$ok" = "1" ] && echo 可用 || echo 不可用)"
            # 三个 suite 必须都能取到：缺 jammy-security 会让 apt-get update 直接失败
            if [ "$ok" = "1" ]; then mirror="$url"; break; fi
          done
          if [ -z "$mirror" ]; then echo "所有候选镜像都不可用，拒绝继续" >&2; exit 1; fi
          echo "使用镜像 $mirror"

          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          sudo sed -i 's/^deb /#deb /' /etc/apt/sources.list || true
          {
            echo "deb $mirror jammy main universe restricted multiverse"
            echo "deb $mirror jammy-updates main universe restricted multiverse"
            echo "deb $mirror jammy-security main universe restricted multiverse"
          } | sudo tee /etc/apt/sources.list.d/yuejian-mirror.list

          # 超时与重试是必需品：网络卡住时 apt 默认无限等，一步就能吃掉整个 job 的时间预算。
          # 20 秒单请求超时 + 3 次重试，配合外层 timeout 兜住「不失败也不前进」的情况。
          APT_OPTS=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o Acquire::Languages=none
            -o Dpkg::Use-Pty=0
          )
          export DEBIAN_FRONTEND=noninteractive
          sudo timeout 240 apt-get update "${APT_OPTS[@]}"
          # install 的超时给到 40 分钟：它的作用只是兜住「不失败也不前进」，不该把
          # 「慢但能装完」（换成慢镜像时约 37 分钟）变成失败。真正的速度靠上面选镜像。
          sudo timeout 2400 apt-get install -y --no-install-recommends "${APT_OPTS[@]}" \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: 添加 macOS 双架构目标
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # 保证安装包版本与 Release 版本一致：标签必须等于 v + package.json 版本号
      - name: 校验标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "标签 $tag 与 package.json 版本 $version 不一致，请打 v$version" >&2
            exit 1
          fi

      - name: 安装前端依赖
        run: npm install

      - name: 构建安装包
        run: npm run bundle ${{ matrix.build_args && format('-- {0}', matrix.build_args) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          # 只上传可直接安装的产物，不带打包中间目录
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/macos/*.dmg
            src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # 额外产出固定文件名的副本，官网用 /releases/latest/download/<固定名> 直链下载，
      # 这样版本号变化时官网链接不需要跟着改
      - name: 生成固定文件名副本
        shell: bash
        run: |
          mkdir -p stable
          cp src-tauri/target/release/bundle/nsis/*.exe stable/yuejian-windows-x64-setup.exe 2>/dev/null || true
          cp src-tauri/target/release/bundle/deb/*.deb stable/yuejian-linux-amd64.deb 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage stable/yuejian-linux-amd64.AppImage 2>/dev/null || true
          cp src-tauri/target/*/release/bundle/macos/*.dmg stable/yuejian-macos-universal.dmg 2>/dev/null || true
          cp src-tauri/target/*/release/bundle/dmg/*.dmg stable/yuejian-macos-universal.dmg 2>/dev/null || true
          ls -l stable

      # 打标签时把本平台的安装包直接上传到对应 Release（三个任务并发上传，action 会自动复用已有 Release）
      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 每个平台只产出其中一部分格式，因此允许部分匹配不中
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/macos/*.dmg
            src-tauri/target/*/release/bundle/dmg/*.dmg
            stable/*
          fail_on_unmatched_files: false
          # 三个任务共享同一个 Release，只让其中一个生成变更说明，避免内容重复
          generate_release_notes: ${{ matrix.platform == 'windows-latest' }}
