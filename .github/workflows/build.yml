name: 构建三端安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            build_args: ""
          - platform: ubuntu-22.04
            build_args: ""
          - platform: macos-14
            build_args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    env:
      # 构建期下载的依赖全部落在工作区内，工作区外不产生额外目录
      CARGO_HOME: ${{ github.workspace }}/.toolchains/cargo
      npm_config_cache: ${{ github.workspace }}/.cache/npm

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: 添加 macOS 双架构目标
        if: matrix.platform == 'macos-14'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: 安装前端依赖
        run: npm install

      - name: 构建安装包
        run: npm run bundle ${{ matrix.build_args && format('-- {0}', matrix.build_args) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: error
