name: 构建三端安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            build_args: ""
          - platform: ubuntu-22.04
            build_args: ""
          - platform: macos-latest
            build_args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    env:
      # 构建期下载的依赖全部落在工作区内，工作区外不产生额外目录
      CARGO_HOME: ${{ github.workspace }}/.toolchains/cargo
      npm_config_cache: ${{ github.workspace }}/.cache/npm

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # 本账户的 Ubuntu runner 无法解析 *.ubuntu.com（apt-get update 会一直挂起），
          # 因此先移除官方源，改用可解析的阿里云镜像。
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          sudo sed -i 's/^deb /#deb /' /etc/apt/sources.list || true
          echo 'deb https://mirrors.aliyun.com/ubuntu jammy main universe restricted multiverse' | sudo tee /etc/apt/sources.list.d/yuejian-mirror.list
          echo 'deb https://mirrors.aliyun.com/ubuntu jammy-updates main universe restricted multiverse' | sudo tee -a /etc/apt/sources.list.d/yuejian-mirror.list
          echo 'deb https://mirrors.aliyun.com/ubuntu jammy-security main universe restricted multiverse' | sudo tee -a /etc/apt/sources.list.d/yuejian-mirror.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: 添加 macOS 双架构目标
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # 保证安装包版本与 Release 版本一致：标签必须等于 v + package.json 版本号
      - name: 校验标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "标签 $tag 与 package.json 版本 $version 不一致，请打 v$version" >&2
            exit 1
          fi

      - name: 安装前端依赖
        run: npm install

      - name: 构建安装包
        run: npm run bundle ${{ matrix.build_args && format('-- {0}', matrix.build_args) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          # 只上传可直接安装的产物，不带打包中间目录
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/macos/*.dmg
            src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # 额外产出固定文件名的副本，官网用 /releases/latest/download/<固定名> 直链下载，
      # 这样版本号变化时官网链接不需要跟着改
      - name: 生成固定文件名副本
        shell: bash
        run: |
          mkdir -p stable
          cp src-tauri/target/release/bundle/nsis/*.exe stable/yuejian-windows-x64-setup.exe 2>/dev/null || true
          cp src-tauri/target/release/bundle/deb/*.deb stable/yuejian-linux-amd64.deb 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage stable/yuejian-linux-amd64.AppImage 2>/dev/null || true
          cp src-tauri/target/*/release/bundle/macos/*.dmg stable/yuejian-macos-universal.dmg 2>/dev/null || true
          cp src-tauri/target/*/release/bundle/dmg/*.dmg stable/yuejian-macos-universal.dmg 2>/dev/null || true
          ls -l stable

      # 打标签时把本平台的安装包直接上传到对应 Release（三个任务并发上传，action 会自动复用已有 Release）
      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 每个平台只产出其中一部分格式，因此允许部分匹配不中
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/*/release/bundle/macos/*.dmg
            src-tauri/target/*/release/bundle/dmg/*.dmg
            stable/*
          fail_on_unmatched_files: false
          # 三个任务共享同一个 Release，只让其中一个生成变更说明，避免内容重复
          generate_release_notes: ${{ matrix.platform == 'windows-latest' }}
