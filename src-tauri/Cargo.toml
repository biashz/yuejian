[package]
name = "yuejian"
version = "0.1.32"
description = "阅笺 · PDF 与 Markdown 本地阅读器"
authors = ["YueJian"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "yuejian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comrak = "0.49.0"
rfd = "0.17.2"
# 文本格式：编码探测 + 解码。两者都是 Firefox 在用的实现：
# chardetng 负责在没有 BOM 时猜编码，encoding_rs 负责真正解码（GB18030 / Big5 / Shift_JIS 全覆盖）。
encoding_rs = "0.8"
chardetng = "0.1"
# 大文件建行索引要扫一遍全文找换行。std 的逐字节循环只有 ~90MB/s，100MB 要一秒多；
# memchr 是 SIMD 实现（本来就在依赖树里），同样的活快一个数量级。
memchr = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
